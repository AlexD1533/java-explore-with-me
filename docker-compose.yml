services:
  stats-server:
    build:
      context: ./
      dockerfile: stats-service/stats-server/Dockerfile
    container_name: stats-server
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=production
    depends_on:
      stats-db:
        condition: service_healthy # Ждем, пока база скажет "я готова"

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    environment:
      - POSTGRES_DB=stats_db
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d stats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ewm-service:
    build:
      context: ./
      dockerfile: ewm-service/Dockerfile
    container_name: ewm-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
    depends_on:
      ewm-db:
        condition: service_healthy

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    environment:
      - POSTGRES_DB=ewm_db
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d ewm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
